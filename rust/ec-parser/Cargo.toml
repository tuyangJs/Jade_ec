[package]
name = "ec-parser"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true